name: whitelabel

services:
  whitelabel-db:
    image: postgres:16-alpine
    ports:
      - "5532:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=whitelabeldb
    volumes:
      - /Volumes/Backup/DockerSSD/whitelabeldb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d whitelabeldb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  whitelabel-keycloak-db:
    image: postgres:16-alpine
    ports:
      - "5533:5432"
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=whitelabel_keycloakdb
    volumes:
      - /Volumes/Backup/DockerSSD/whitelabel_keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d whitelabel_keycloakdb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  whitelabel-keycloak-app:
    image: quay.io/keycloak/keycloak:24.0.1
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://whitelabel-keycloak-db:5432/whitelabel_keycloakdb
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    restart: unless-stopped
    depends_on:
      whitelabel-keycloak-db:
        condition: service_healthy
